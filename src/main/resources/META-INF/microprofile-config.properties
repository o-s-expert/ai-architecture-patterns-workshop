# Google Gemini configuration for the workshop.
# The API key is NOT stored here: read it from the GEMINI_API_KEY environment variable
# (MicroProfile Config exposes environment variables as properties).
#
# This is a workshop-specific key consumed by the model producer created in Lab 1;
# it is not a property of the LangChain4j CDI extension.
gemini.model-name=gemini-2.5-flash

# The langchain4j-cdi-config module can also build components from properties
# (dev.langchain4j.cdi.plugin.<name>.class, .scope, .config.<builderProperty>).
# That mechanism has not been verified against the Gemini builder yet, so it is not enabled.
